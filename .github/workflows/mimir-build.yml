name: Mimir-Kernel

on:
  workflow_dispatch:
    inputs:
      upload_target:
        description: 'Upload destination'
        required: true
        default: 'github'
        type: choice
        options:
          - github
          - gofile

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:13-slim

    env:
      DEVICE: jeter
      DEVICE_NAME: Motorola G6 Play
      KERNEL_NAME: Mimir Kernel
      TARGET_REPO: mimir-kernel/jeter_releases

    steps:
      - name: Setting up the environment
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            jq \
            zip \
            curl \
            git \
            make \
            python3 \
            perl \
            libssl-dev \
            libelf-dev \
            bc \
            ca-certificates

          # Creates the manual symbolic link to replace the old python-is-python3
          ln -sf /usr/bin/python3 /usr/bin/python

      - name: Check Out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Force Git to consider the current directory in the Actions container environment.
      - name: Safe Directory Config
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set Timezone
        run: |
          sudo ln -snf /usr/share/zoneinfo/America/Sao_Paulo /etc/localtime
          echo "America/Sao_Paulo" | sudo tee /etc/timezone

      - name: Generate Build Environment Variables
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Notify Build Started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "parse_mode=markdown" \
          -d "text=🚀 *New version of Mimir Kernel is compiling!*%0A%0A📦 *Repo:* \`${{ env.REPO_NAME }}\` %0A📱 *Device:* ${{ env.DEVICE_NAME }} (\`${{ env.DEVICE }}\`) %0A🌿 *Branch:* \`${{ github.ref_name }}\` %0A⏳ *Please wait for completion...*" \
          -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"🔍 View real-time log\",\"url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]]}"

      - name: Run build script
        run: |
          ./build.sh ${{ env.DEVICE }} -z
        env:
          UPLOAD_TARGET: ${{ github.event.inputs.upload_target }}

      # Creates the release in the external target repository with link to the changelog file
      - name: Create GitHub Release
        if: success() && github.event.inputs.upload_target == 'github'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          NOTES="- **Device:** ${{ env.DEVICE_NAME }}
          - **Branch:** \`${{ github.ref_name }}\`

          ### 📝 Changelog
          The changelog for this build can be found here: [View Full Changelog](https://github.com/mimir-kernel/jeter_releases/blob/master/changelog_q.md)"

          gh release create "${{ env.DEVICE }}-${{ github.run_id }}" ./*.zip \
            --repo "${{ env.TARGET_REPO }}" \
            --title "${{ env.KERNEL_NAME }} for ${{ env.DEVICE }} - ${{ env.BUILD_DATE }}" \
            --notes "$NOTES"

      - name: Send Notification (Success)
        if: success()
        shell: bash
        run: |
          if [ "${{ github.event.inputs.upload_target }}" == "github" ]; then
             BTN_TEXT="📥 Download (GitHub)"
             BTN_URL="https://github.com/${{ env.TARGET_REPO }}/releases/tag/${{ env.DEVICE }}-${{ github.run_id }}"
             SERVER_LINE=""
          else
             BTN_TEXT="📥 Download (Gofile)"
             BTN_URL="${{ env.ZIP_DOWNLOAD_LINK }}"
             SERVER_LINE="🌐 *Server:* \`${{ env.GOFILE_SERVER }}\` (10 days)%0A"
          fi

          MSG="✅ *New Mimir Kernel build for ${{ env.DEVICE }} available!*%0A%0A"
          MSG+="🛠️ *Compiler:* \`$TOOLCHAIN_VERSION\`%0A"
          MSG+="⏱️ *Time:* \`$BUILD_DURATION\`%0A"
          MSG+="$SERVER_LINE"
          MSG+="🔐 *SHA256:* \`$ZIP_SHA256\`"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=markdown" \
            -d "text=$MSG" \
            -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"$BTN_TEXT\",\"url\":\"$BTN_URL\"}]]}"

      - name: Send Notification (Failure)
        if: failure()
        run: |
          [ -z "$ERROR_LOG_URL" ] && ERROR_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || ERROR_URL="$ERROR_LOG_URL"

          MESSAGE="❌ *Kernel build failed!*
          🛠️ *Compiler:* \`${TOOLCHAIN_VERSION:-Error}\`
          🆔 *Run ID:* ${{ github.run_id }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=markdown" \
            -d "text=$MESSAGE" \
            -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"📂 View Error Log\",\"url\":\"$ERROR_URL\"}]]}"

      - name: Cleanup workspace
        if: always()
        run: rm -rf out gcc *.zip
